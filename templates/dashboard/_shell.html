{% extends "base.html" %}
{% block content %}
<section class="section" style="padding-top:2.5rem; background:var(--paper); min-height:70vh;">
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <span class="eyebrow">Dashboard</span>
        <h1 class="mt-1 mb-0" style="font-size:1.7rem;">{{ business.name }}</h1>
      </div>
      <span class="badge-pill" style="background:{% if business.approval_status == 'approved' %}var(--lake){% elif business.approval_status == 'pending' %}var(--amber){% else %}var(--clay){% endif %}; color:{% if business.approval_status == 'pending' %}var(--ink){% else %}var(--white){% endif %};">
        {{ business.get_approval_status_display }}
      </span>
    </div>

    <div class="row g-4">
      <div class="col-lg-3">
        <div class="biz-card p-2">
          <nav class="d-flex flex-lg-column">
            <a href="{% url 'dashboard:overview' %}" class="nav-link-custom d-block px-3 py-2">Overview</a>
            <a href="{% url 'dashboard:edit_business' %}" class="nav-link-custom d-block px-3 py-2">My Business</a>
            <a href="{% url 'dashboard:services' %}" class="nav-link-custom d-block px-3 py-2">Services</a>
            <a href="{% url 'dashboard:photos' %}" class="nav-link-custom d-block px-3 py-2">Photos</a>
            <a href="{% url 'dashboard:reviews' %}" class="nav-link-custom d-block px-3 py-2">Reviews</a>
            <a href="{% url 'dashboard:subscription' %}" class="nav-link-custom d-block px-3 py-2">Subscription</a>
            <a href="{% url 'dashboard:advertise' %}" class="nav-link-custom d-block px-3 py-2">Advertise</a>
            <a href="{{ business.get_absolute_url }}" class="nav-link-custom d-block px-3 py-2"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i> View public page</a>
          </nav>
        </div>
      </div>
      <div class="col-lg-9">
        {% block dashboard_content %}{% endblock %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
